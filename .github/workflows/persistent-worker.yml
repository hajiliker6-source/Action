name: Persistent Worker

on:
  repository_dispatch:
    types: [start-worker]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Base Dependencies
        run: |
          pip install gradio_client requests[socks] pillow httpx[socks] pysocks socksio

      - name: Build VPN Gate Docker Image
        run: |
          # ساخت یک ایمیج فوق سبک برای اجرای OpenVPN و تبدیل آن به SOCKS5 داخلی
          mkdir -p vpn_docker
          cat << 'EOF' > vpn_docker/Dockerfile
          FROM alpine:latest
          RUN apk add --no-cache openvpn curl bash
          RUN apk add --no-cache microsocks --repository=http://dl-cdn.alpinelinux.org/alpine/edge/testing/
          COPY entrypoint.sh /entrypoint.sh
          RUN chmod +x /entrypoint.sh
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

          cat << 'EOF' > vpn_docker/entrypoint.sh
          #!/bin/bash
          # ورود خودکار مشخصات vpn gate
          echo -e "vpn\nvpn" > /pass.txt
          sed -i 's/^auth-user-pass.*/auth-user-pass \/pass.txt/' /vpn.ovpn
          
          # اجرای پراکسی در پس‌زمینه
          microsocks -p 1080 &
          
          # اجرای VPN ژاپن (اگر این گره خاموش باشد، کانتینر خودکار بسته می‌شود و پایتون سریع متوجه می‌شود)
          exec openvpn --config /vpn.ovpn --pull-filter ignore "ifconfig-ipv6" --pull-filter ignore "route-ipv6" --auth-retry nointeract
          EOF

          docker build -t vpngate-node vpn_docker/

      - name: Fetch VPN Gate (Japan) & Start 20 Nodes
        run: |
          echo "📥 Downloading VPN Gate database (University of Tsukuba, Japan)..."
          # دریافت لیست سرورهای داوطلبانه از دانشگاه تسوکوبا
          curl -s https://www.vpngate.net/api/iphone/ | grep -E "^[^#*]" > vpngate.csv
          
          # مرتب‌سازی بر اساس بالاترین امتیاز پایداری (Score)
          sort -t, -k3 -nr vpngate.csv > sorted_vpn.csv
          
          i=1
          while IFS=, read -r HostName IP Score Ping Speed CountryLong CountryShort NumVpnSessions Uptime Users TotalTraffic LogType Operator Message OpenVPN_ConfigData_Base64; do
            if [ -n "$OpenVPN_ConfigData_Base64" ] && [ "$OpenVPN_ConfigData_Base64" != "\r" ]; then
              B64=$(echo "$OpenVPN_ConfigData_Base64" | tr -d '\r')
              echo "$B64" | base64 -d > "vpn_dir_$i.ovpn" 2>/dev/null
              
              if [ -s "vpn_dir_$i.ovpn" ]; then
                PORT=$((4000 + i))
                docker run -d --name vpn$i --cap-add=NET_ADMIN --device=/dev/net/tun -v $(pwd)/vpn_dir_$i.ovpn:/vpn.ovpn -p $PORT:1080 vpngate-node > /dev/null 2>&1
                echo "✅ Started VPN Gate Node $i on Port $PORT (Country: $CountryLong, Score: $Score)"
                i=$((i+1))
                if [ "$i" -gt 20 ]; then break; fi
              fi
            fi
          done < sorted_vpn.csv
          
          echo "⏳ Waiting 12 seconds for OpenVPN Handshakes..."
          sleep 12

      - name: Run Persistent Ghost Worker
        env:
          SPACE_URL: ${{ github.event.client_payload.space_url }}
        run: |
          cat << 'EOF' > worker.py
          import os
          import sys
          import time
          import json
          import requests
          import subprocess
          import threading
          import random

          SPACE_URL = os.environ.get("SPACE_URL")
          if not SPACE_URL:
              sys.exit(1)

          github_run_id = os.environ.get("GITHUB_RUN_ID", "local-worker")
          start_time = time.time()
          max_run_duration = 5 * 60 * 60  # 5 hours

          def send_live_log(run_id, message):
              """ارسال مستقیم و لحظه‌ای لاگ کارگر به وب‌سایت شما"""
              if not run_id:
                  return
              try:
                  requests.post(f"{SPACE_URL}/api/log/update", json={"run_id": str(run_id), "message": str(message)}, timeout=3)
              except: pass

          def run_worker_thread(worker_index):
              thread_worker_id = f"{github_run_id}_w{worker_index}"
              print(f"[{worker_index}] Worker thread started.", flush=True)
              
              while time.time() - start_time < max_run_duration:
                  try:
                      try: 
                          requests.post(f"{SPACE_URL}/api/worker/heartbeat", json={"worker_id": thread_worker_id}, timeout=10)
                      except: pass

                      r = requests.post(f"{SPACE_URL}/api/worker/poll", json={"worker_id": thread_worker_id}, timeout=15)
                      if r.status_code == 200:
                          data = r.json()
                          if data.get("status") == "success":
                              run_id = data.get("run_id")
                              event_type = data.get("event_type")
                              client_payload = data.get("status") if 'client_payload' not in data else data.get("client_payload", {})
                              
                              if not client_payload or client_payload == "success":
                                  client_payload = data.get("client_payload", {})

                              print(f"[{run_id}] Task assigned to worker {worker_index}.", flush=True)
                              send_live_log(run_id, f"📥 تسک به کارگر شماره {worker_index} در گیت‌هاب واگذار شد.")
                              
                              script_content = client_payload.get("data", {}).get("script") or client_payload.get("script")
                              if not script_content:
                                  continue
                                  
                              script_file = f"run_job_{run_id}_w{worker_index}.py"
                              with open(script_file, "w", encoding="utf-8") as f:
                                  f.write(script_content)

                              success = False
                              
                              # پورت‌های اختصاص یافته به 20 کانتینر VPN Gate
                              available_ports = list(range(4001, 4021))
                              random.shuffle(available_ports)
                              
                              # سیستم اسنایپر: تست پیش‌هنگام گره‌های خانگی
                              for attempt in range(1, len(available_ports) + 1):
                                  if not available_ports:
                                      break
                                  port = available_ports.pop()
                                  proxy = f"127.0.0.1:{port}"
                                      
                                  print(f"[{run_id}] Internal Attempt {attempt} | Testing VPN Node on port {port}...", flush=True)
                                  send_live_log(run_id, f"🔍 تست اتصال به گره VPN خانگی (پورت {port})...")
                                  
                                  # تست 5 ثانیه‌ای برای بررسی زنده بودن سیستم میزبان داوطلب
                                  try:
                                      test_r = requests.get("https://huggingface.co/", proxies={"http": f"socks5h://{proxy}", "https": f"socks5h://{proxy}"}, timeout=5)
                                      if test_r.status_code in [200, 401, 403, 404, 405]:
                                          print(f"[{run_id}] VPN Node on {port} is ALIVE! Spawning Gradio...", flush=True)
                                          send_live_log(run_id, f"✅ گره متصل است! اجرای مدل هوش مصنوعی (بدون تحریم آی‌پی)...")
                                      else:
                                          send_live_log(run_id, f"⚠️ گره پاسخ نداد. پرش در ۱ ثانیه...")
                                          continue
                                  except Exception:
                                      send_live_log(run_id, f"⚠️ گره قطع بود. پرش سریع به گره بعدی...")
                                      continue 
                                  
                                  # اجرای اسکریپت رندر مدل با اتصال از طریق گره سالم
                                  job_env = os.environ.copy()
                                  job_env["HTTP_PROXY"] = f"socks5h://{proxy}"
                                  job_env["HTTPS_PROXY"] = f"socks5h://{proxy}"
                                  job_env["ALL_PROXY"] = f"socks5h://{proxy}"
                                  
                                  for key, val in client_payload.items():
                                      if key != "data": 
                                          job_env[key.upper()] = str(val)
                                  
                                  payload_data = client_payload.get("data", {})
                                  if isinstance(payload_data, dict):
                                      for key, val in payload_data.items():
                                          if key == "image_urls": job_env["IMAGE_URLS"] = json.dumps(val)
                                          else: job_env[key.upper()] = str(val)
                                          
                                  process = subprocess.Popen(
                                      [sys.executable, script_file],
                                      env=job_env,
                                      stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT,
                                      text=True
                                  )
                                  
                                  def kill_proc(p):
                                      try: p.kill()
                                      except: pass
                                      
                                  # 90 ثانیه فرصت رندر به مدل می‌دهیم
                                  timer = threading.Timer(90, kill_proc, [process])
                                  try:
                                      timer.start()
                                      for line in process.stdout:
                                          clean_line = line.strip()
                                          print(f"[{run_id}] {clean_line}", flush=True)
                                          send_live_log(run_id, f"[خروجی] {clean_line}")
                                      process.wait()
                                  finally:
                                      timer.cancel()
                                  
                                  if process.returncode == 0:
                                      success = True
                                      break
                                  else:
                                      print(f"[{run_id}] Node on port {port} failed at runtime or quota hit.", flush=True)
                                      send_live_log(run_id, f"⚠️ عملیات قطع شد. تست گره جایگزین در کسری از ثانیه...")

                              try: os.remove(script_file)
                              except: pass

                              if not success:
                                  print(f"[{run_id}] All VPN nodes failed. Retrying in queue...", flush=True)
                                  send_live_log(run_id, "❌ تمام گره‌های تست شده قطع بودند. بازگرداندن به صف برای تلاش مجدد سیستم...")
                                  try:
                                      requests.post(f"{SPACE_URL}/api/webhook/fail", json={"run_id": run_id, "error": "All 20 VPN nodes failed.", "github_run_id": github_run_id}, timeout=15)
                                  except: pass
                                  
                  except Exception as e:
                      pass
                  time.sleep(2)

          threads = []
          # اجرای 20 کارگر موازی
          for idx in range(1, 21):
              t = threading.Thread(target=run_worker_thread, args=(idx,), daemon=True)
              t.start()
              threads.append(t)

          while time.time() - start_time < max_run_duration:
              time.sleep(10)

          print("All worker threads finished. Exiting.", flush=True)
          EOF
          python worker.py
