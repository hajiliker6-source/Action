name: Persistent Worker

on:
  repository_dispatch:
    types: [start-worker]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Base Dependencies
        run: |
          pip install "gradio_client" "requests[socks]" "pillow" "httpx[socks]" pysocks socksio

      - name: Install and Start 5 Parallel WARP Containers
        run: |
          # دانلود و اجرای ۵ کلاینت ایزوله کلودفلر وارپ روی پورت‌های ۴۰۰۱ تا ۴۰۰۵
          for i in {1..5}; do
            PORT=$((4000 + i))
            docker run -d --name warp$i --cap-add=NET_ADMIN -p $PORT:1080 caomingjun/warp
            echo "Started WARP Instance $i on Port $PORT"
          done
          
          # زمان دادن به کانتینرها برای اتصال کامل به شبکه کلودفلر
          sleep 12
          
          # تست پورت‌های اول و دوم جهت تایید نهایی تغییر آی‌پی‌ها
          curl --socks5-hostname 127.0.0.1:4001 https://ifconfig.me || true
          curl --socks5-hostname 127.0.0.1:4002 https://ifconfig.me || true

      - name: Run Persistent Worker
        env:
          SPACE_URL: ${{ github.event.client_payload.space_url }}
        run: |
          cat << 'EOF' > worker.py
          import os
          import sys
          import time
          import json
          import socket
          import requests
          import subprocess
          import threading
          from datetime import datetime

          SPACE_URL = os.environ.get("SPACE_URL")
          if not SPACE_URL:
              print("Error: SPACE_URL env var is not set.", flush=True)
              sys.exit(1)

          print(f"Starting long-running multi-worker with 5 WARPs for Space: {SPACE_URL}", flush=True)

          start_time = time.time()
          max_run_duration = 5 * 60 * 60  # 5 hours
          github_run_id = os.environ.get("GITHUB_RUN_ID", "local-worker")

          def check_and_wait_for_warp(socks_port):
              """صبر کردن برای فعال شدن کامل کانتینر داکر وارپ پس از ریست"""
              for _ in range(12):
                  try:
                      proxies = {
                          'http': f'socks5h://127.0.0.1:{socks_port}',
                          'https': f'socks5h://127.0.0.1:{socks_port}'
                      }
                      r = requests.get("https://api.ipify.org", proxies=proxies, timeout=5)
                      if r.status_code == 200:
                          return r.text.strip()
                  except:
                      pass
                  time.sleep(2)
              return None

          def renew_warp_ip(worker_index, socks_port):
              """حذف کانتینر قبلی و اجرای مجدد آن برای دریافت آی‌پی کاملاً تازه از کلودفلر"""
              try:
                  subprocess.run(f"docker rm -f warp{worker_index}", shell=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  time.sleep(1)
                  subprocess.run(f"docker run -d --name warp{worker_index} --cap-add=NET_ADMIN -p {socks_port}:1080 caomingjun/warp", shell=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  current_ip = check_and_wait_for_warp(socks_port)
                  if current_ip:
                      print(f"🔄 [Worker {worker_index}] Cloudflare WARP IP rotated successfully. New IP: {current_ip}", flush=True)
                      return current_ip
              except Exception as e:
                  print(f"⚠️ [Worker {worker_index}] Error renewing WARP IP: {e}", flush=True)
              return None

          def run_worker_thread(worker_index, socks_port):
              print(f"[{worker_index}] Worker thread started using SOCKS {socks_port}", flush=True)
              thread_worker_id = f"{github_run_id}_w{worker_index}"
              
              while time.time() - start_time < max_run_duration:
                  try:
                      # ارسال ضربان قلب مجهز به شناسه منحصربه‌فرد این نخ کارگر موازی
                      try:
                          requests.post(f"{SPACE_URL}/api/worker/heartbeat", json={"worker_id": thread_worker_id}, timeout=10)
                      except Exception as e:
                          pass

                      # Poll for new jobs
                      r = requests.post(f"{SPACE_URL}/api/worker/poll", json={}, timeout=15)
                      if r.status_code == 200:
                          data = r.json()
                          if data.get("status") == "success":
                              run_id = data.get("run_id")
                              event_type = data.get("event_type")
                              client_payload = data.get("status") if 'client_payload' not in data else data.get("client_payload", {})
                              
                              if not client_payload or client_payload == "success":
                                  client_payload = data.get("client_payload", {})

                              print(f"[{run_id}] Thread {worker_index} grabbed job ({event_type})", flush=True)
                              
                              # تنظیمات محیطی استاندارد کارگر
                              job_env = os.environ.copy()
                              
                              # ارجاع ترافیک پردازش این کارگر به پورت پروکسی وارپ اختصاصی خودش
                              job_env["HTTP_PROXY"] = f"socks5h://127.0.0.1:{socks_port}"
                              job_env["HTTPS_PROXY"] = f"socks5h://127.0.0.1:{socks_port}"
                              
                              # Map client_payload to environment variables
                              for key, val in client_payload.items():
                                  if key != "data":
                                      job_env[key.upper()] = str(val)
                              
                              payload_data = client_payload.get("data", {})
                              if isinstance(payload_data, dict):
                                  for key, val in payload_data.items():
                                      if key == "image_urls":
                                          job_env["IMAGE_URLS"] = json.dumps(val)
                                      else:
                                          job_env[key.upper()] = str(val)
                          
                              # Extract the script
                              script_content = payload_data.get("script") or client_payload.get("script")
                              if not script_content:
                                  print(f"Error: No script found in payload for job {run_id}", flush=True)
                                  continue
                                  
                              # ایجاد فایل اسکریپت منحصربه‌فرد برای این کارگر جهت عدم تداخل
                              script_file = f"run_job_{run_id}_w{worker_index}.py"
                              with open(script_file, "w", encoding="utf-8") as f:
                                  f.write(script_content)
                                  
                              max_ip_attempts = 15
                              ip_attempt = 0
                              job_success = False
                              last_ip = None

                              while ip_attempt < max_ip_attempts:
                                  ip_attempt += 1
                                  current_ip = check_and_wait_for_warp(socks_port) or "Unknown"
                                  
                                  # تایید تغییر واقعی آدرس آی‌پی برای بهینه‌سازی پردازش
                                  if last_ip and current_ip == last_ip and ip_attempt > 1:
                                      print(f"[{run_id}] IP did not change ({current_ip}). Re-requesting WARP container reset...", flush=True)
                                      renew_warp_ip(worker_index, socks_port)
                                      current_ip = check_and_wait_for_warp(socks_port) or "Unknown"
                                      
                                  last_ip = current_ip
                                  print(f"[{run_id}] Current Cloudflare WARP IP: {current_ip}", flush=True)
                                  print(f"Executing script for job {run_id} (IP Attempt {ip_attempt}/{max_ip_attempts})...", flush=True)
                                  
                                  process = subprocess.Popen(
                                      [sys.executable, script_file],
                                      env=job_env,
                                      stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT,
                                      text=True
                                  )
                                  
                                  output_lines = []
                                  for line in process.stdout:
                                      print(f"[{run_id}] {line.strip()}", flush=True)
                                      output_lines.append(line)
                                      
                                  process.wait()
                                  
                                  if process.returncode == 0:
                                      print(f"Job {run_id} finished successfully.", flush=True)
                                      job_success = True
                                      break
                                  
                                  # بروز خطا در فرآیند انتشار یا دریافت خروجی (خطای خروجی غیر از صفر)
                                  print(f"[{run_id}] ⚠️ Job failed (Exit Code {process.returncode}). Assuming IP rate-limit/quota issue.", flush=True)
                                  if ip_attempt < max_ip_attempts:
                                      print(f"[{run_id}] Rotating Cloudflare WARP container and retrying...", flush=True)
                                      renew_warp_ip(worker_index, socks_port)
                                      continue
                                  else:
                                      print(f"[{run_id}] Max IP rotation attempts reached for this job.", flush=True)
                                      break
                                      
                              try:
                                  os.remove(script_file)
                              except:
                                  pass

                              if not job_success:
                                  requests.post(
                                      f"{SPACE_URL}/api/webhook/fail",
                                      json={
                                          "run_id": run_id,
                                          "error": "All Cloudflare WARP IP rotation attempts failed due to quota/rate-limit blocks.",
                                          "github_run_id": os.environ.get("GITHUB_RUN_ID", "")
                                      },
                                      timeout=15
                                  )
                                  
                              continue
                              
                  except Exception as e:
                      print(f"[{worker_index}] Error in thread loop: {e}", flush=True)
                      
                  time.sleep(5)

          # راه‌اندازی ۵ نخ کارگر موازی به همراه اختصاص پورت‌های داکر مجزا
          threads = []
          for idx in range(1, 6):
              port = 4000 + idx
              t = threading.Thread(target=run_worker_thread, args=(idx, port), daemon=True)
              t.start()
              threads.append(t)

          # نگه داشتن نخ اصلی تا زمانی که زمان اجرا به پایان برسد
          while time.time() - start_time < max_run_duration:
              time.sleep(10)

          print("All worker threads finished. Exiting.", flush=True)
          EOF
          python worker.py
