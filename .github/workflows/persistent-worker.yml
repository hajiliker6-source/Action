name: Persistent Worker

on:
  repository_dispatch:
    types: [start-worker]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Base Dependencies
        run: |
          pip install "gradio_client" "requests[socks]" "pillow" "httpx[socks]" pysocks socksio

      - name: Install and Start Cloudflare WARP
        run: |
          # افزودن کلید GPG کلودفلر
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          
          # افزودن مخزن سازگار jammy (جهت جلوگیری از خطای ۴۰۴ روی نسخه noble)
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          sudo apt-get update
          sudo apt-get install cloudflare-warp -y
          
          # اجرای دیمن سرویس وارپ
          sudo systemctl start warp-svc || sudo /usr/bin/warp-svc &
          sleep 4
          
          # تنظیم کلودفلر به صورت اتصال بومی سیستمی (بدون نیاز به پروکسی و پورت)
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          
          # حلقه انتظار هوشمند جهت اطمینان از اتصال کامل کلودفلر قبل از شروع رانر
          for i in {1..15}; do
            status=$(warp-cli --accept-tos status)
            if echo "$status" | grep -q "Connected"; then
              echo "WARP is successfully connected!"
              break
            fi
            echo "Waiting for WARP to connect (Attempt $i/15)..."
            sleep 2
          done
          
          # تست نهایی و نمایش آی‌پی جدید دریافتی از کلودفلر وارپ
          curl https://ifconfig.me || true

      - name: Run Persistent Worker
        env:
          SPACE_URL: ${{ github.event.client_payload.space_url }}
        run: |
          cat << 'EOF' > worker.py
          import os
          import sys
          import time
          import json
          import requests
          import subprocess
          from datetime import datetime

          SPACE_URL = os.environ.get("SPACE_URL")
          if not SPACE_URL:
              print("Error: SPACE_URL env var is not set.", flush=True)
              sys.exit(1)

          print(f"Starting long-running worker for Space: {SPACE_URL}", flush=True)

          start_time = time.time()
          max_run_duration = 5 * 60 * 60  # 5 hours

          def wait_for_warp_connection():
              """صبر کردن هوشمند تا اتصال فیزیکی و پایدار کلودفلر برقرار شود"""
              for i in range(15):
                  try:
                      res = subprocess.run(["warp-cli", "--accept-tos", "status"], capture_output=True, text=True)
                      if "Connected" in res.stdout:
                          print("✅ WARP Connection verified as Connected.", flush=True)
                          return True
                  except Exception as e:
                      pass
                  time.sleep(2)
              print("⚠️ Warning: WARP failed to reach Connected status within timeout.", flush=True)
              return False

          def renew_warp_ip():
              """حذف دیوایس فعلی و ثبت‌نام دیوایس جدید در کلودفلر برای تغییر فوری آی‌پی سیستمی"""
              try:
                  # دیسکانکت و ابطال هویت فعلی
                  subprocess.run(["warp-cli", "--accept-tos", "disconnect"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  subprocess.run(["warp-cli", "--accept-tos", "registration", "delete"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  time.sleep(1)
                  # ثبت هویت جدید و اتصال مجدد به صورت بومی
                  subprocess.run(["warp-cli", "--accept-tos", "registration", "new"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  subprocess.run(["warp-cli", "--accept-tos", "mode", "warp"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  subprocess.run(["warp-cli", "--accept-tos", "connect"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  
                  # انتظار برای اتصال پایدار
                  wait_for_warp_connection()
                  print("🔄 Cloudflare WARP IP successfully rotated/renewed natively.", flush=True)
                  return True
              except Exception as e:
                  print(f"⚠️ Error renewing WARP IP: {e}", flush=True)
              return False

          def get_current_ip():
              """دریافت آی‌پی عمومی فعلی سیستم بدون نیاز به پروکسی (وارپ بومی)"""
              try:
                  r = requests.get("https://api.ipify.org", timeout=12)
                  return r.text.strip()
              except Exception as e:
                  return f"Unknown ({e})"

          while time.time() - start_time < max_run_duration:
              try:
                  # Send heartbeat to Space
                  try:
                      requests.post(f"{SPACE_URL}/api/worker/heartbeat", json={}, timeout=10)
                  except Exception as e:
                      print(f"Heartbeat failed: {e}", flush=True)

                  # Poll for new jobs
                  r = requests.post(f"{SPACE_URL}/api/worker/poll", json={}, timeout=15)
                  if r.status_code == 200:
                      data = r.json()
                      if data.get("status") == "success":
                          run_id = data.get("run_id")
                          event_type = data.get("event_type")
                          client_payload = data.get("status") if 'client_payload' not in data else data.get("client_payload", {})
                          
                          # پشتیبانی از ساختارهای توکن‌بندی مختلف
                          if not client_payload or client_payload == "success":
                              client_payload = data.get("client_payload", {})

                          print(f"[{datetime.now()}] Processing job {run_id} ({event_type})...", flush=True)
                          
                          # تنظیمات محیطی استاندارد
                          job_env = os.environ.copy()
                          
                          # Map client_payload to environment variables
                          for key, val in client_payload.items():
                              if key != "data":
                                  job_env[key.upper()] = str(val)
                          
                          payload_data = client_payload.get("data", {})
                          if isinstance(payload_data, dict):
                              for key, val in payload_data.items():
                                  if key == "image_urls":
                                      job_env["IMAGE_URLS"] = json.dumps(val)
                                  else:
                                      job_env[key.upper()] = str(val)
                          
                          # Extract the script
                          script_content = payload_data.get("script") or client_payload.get("script")
                          if not script_content:
                              print(f"Error: No script found in payload for job {run_id}", flush=True)
                              continue
                              
                          # Write script to temporary file
                          script_file = "run_job.py"
                          with open(script_file, "w", encoding="utf-8") as f:
                              f.write(script_content)
                              
                          max_ip_attempts = 15
                          ip_attempt = 0
                          job_success = False
                          last_ip = None

                          while ip_attempt < max_ip_attempts:
                              ip_attempt += 1
                              current_ip = get_current_ip()
                              
                              # تایید تغییر واقعی آدرس آی‌پی برای بهینه‌سازی پردازش
                              if last_ip and current_ip == last_ip and ip_attempt > 1:
                                  print(f"[{run_id}] IP did not change ({current_ip}). Re-requesting WARP registration...", flush=True)
                                  renew_warp_ip()
                                  current_ip = get_current_ip()
                                  
                              last_ip = current_ip
                              print(f"[{run_id}] Current Cloudflare WARP IP: {current_ip}", flush=True)
                              print(f"Executing script for job {run_id} (IP Attempt {ip_attempt}/{max_ip_attempts})...", flush=True)
                              
                              process = subprocess.Popen(
                                  [sys.executable, script_file],
                                  env=job_env,
                                  stdout=subprocess.PIPE,
                                  stderr=subprocess.STDOUT,
                                  text=True
                              )
                              
                              output_lines = []
                              for line in process.stdout:
                                  print(f"[{run_id}] {line.strip()}", flush=True)
                                  output_lines.append(line)
                                  
                              process.wait()
                              
                              if process.returncode == 0:
                                  print(f"Job {run_id} finished successfully.", flush=True)
                                  job_success = True
                                  break
                              
                              # وقوع خطای پردازشی
                              print(f"[{run_id}] ⚠️ Job failed (Exit Code {process.returncode}). Assuming IP rate-limit/quota issue.", flush=True)
                              if ip_attempt < max_ip_attempts:
                                  print(f"[{run_id}] Rotating Cloudflare WARP registration and retrying...", flush=True)
                                  renew_warp_ip()
                                  continue
                              else:
                                  print(f"[{run_id}] Max IP rotation attempts reached for this job.", flush=True)
                                  break
                                  
                          if not job_success:
                              sys.exit(1)
                              
                          continue
                          
              except Exception as e:
                  print(f"Error in worker loop: {e}", flush=True)
                  
              time.sleep(5)

          print("Worker reached maximum run duration. Exiting.", flush=True)
          EOF
          python worker.py
