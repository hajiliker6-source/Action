name: Persistent Worker

on:
  repository_dispatch:
    types: [start-worker]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Base Dependencies
        run: |
          # نصب کتابخانه‌های ضروری و ابزارهای ارتباط پراکسی
          pip install gradio_client requests[socks] pillow httpx[socks] pysocks socksio

      - name: Run Persistent Ghost Worker
        env:
          SPACE_URL: ${{ github.event.client_payload.space_url }}
        run: |
          cat << 'EOF' > worker.py
          import os
          import sys
          import time
          import json
          import requests
          import subprocess
          import threading
          import random

          SPACE_URL = os.environ.get("SPACE_URL")
          if not SPACE_URL:
              sys.exit(1)

          github_run_id = os.environ.get("GITHUB_RUN_ID", "local-worker")
          start_time = time.time()
          max_run_duration = 5 * 60 * 60  # 5 hours

          # استخر جهانی پراکسی‌ها
          global_proxies = []
          proxy_lock = threading.Lock()

          def send_live_log(run_id, message):
              """ارسال مستقیم و لحظه‌ای لاگ کارگر به وب‌سایت شما"""
              if not run_id:
                  return
              try:
                  requests.post(f"{SPACE_URL}/api/log/update", json={"run_id": str(run_id), "message": str(message)}, timeout=3)
              except: pass

          def fetch_proxies():
              """ربات خزنده برای دانلود هزاران پراکسی SOCKS5 رایگان از سراسر جهان"""
              urls = [
                  "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=socks5&timeout=3000&country=all&ssl=all&anonymity=all",
                  "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt",
                  "https://raw.githubusercontent.com/roosterkid/openproxylist/main/SOCKS5_raw.txt",
                  "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt",
                  "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt"
              ]
              new_proxies = set()
              for u in urls:
                  try:
                      r = requests.get(u, timeout=10)
                      if r.status_code == 200:
                          for line in r.text.split("\n"):
                              p = line.strip()
                              if p and ":" in p:
                                  new_proxies.add(p)
                  except: pass
              
              with proxy_lock:
                  global global_proxies
                  global_proxies = list(set(global_proxies) | new_proxies)
                  random.shuffle(global_proxies)
              print(f"✅ Downloaded and loaded {len(global_proxies)} free SOCKS5 proxies.", flush=True)

          def get_proxy():
              with proxy_lock:
                  if global_proxies:
                      return global_proxies.pop()
                  return None

          # لود اولیه پراکسی‌ها
          fetch_proxies()

          def run_worker_thread(worker_index):
              thread_worker_id = f"{github_run_id}_w{worker_index}"
              print(f"[{worker_index}] Worker thread started.", flush=True)
              
              while time.time() - start_time < max_run_duration:
                  try:
                      try: 
                          requests.post(f"{SPACE_URL}/api/worker/heartbeat", json={"worker_id": thread_worker_id}, timeout=10)
                      except: pass

                      # شارژ مجدد پراکسی‌ها در صورت اتمام
                      with proxy_lock:
                          if len(global_proxies) < 100:
                              threading.Thread(target=fetch_proxies).start()

                      r = requests.post(f"{SPACE_URL}/api/worker/poll", json={"worker_id": thread_worker_id}, timeout=15)
                      if r.status_code == 200:
                          data = r.json()
                          if data.get("status") == "success":
                              run_id = data.get("run_id")
                              event_type = data.get("event_type")
                              client_payload = data.get("status") if 'client_payload' not in data else data.get("client_payload", {})
                              
                              if not client_payload or client_payload == "success":
                                  client_payload = data.get("client_payload", {})

                              print(f"[{run_id}] Task assigned to worker {worker_index}.", flush=True)
                              send_live_log(run_id, f"📥 تسک به کارگر شماره {worker_index} در گیت‌هاب واگذار شد.")
                              
                              script_content = client_payload.get("data", {}).get("script") or client_payload.get("script")
                              if not script_content:
                                  continue
                                  
                              script_file = f"run_job_{run_id}_w{worker_index}.py"
                              with open(script_file, "w", encoding="utf-8") as f:
                                  f.write(script_content)

                              success = False
                              
                              # سیستم اسنایپر: تست سریع 10 پراکسی
                              for attempt in range(1, 11):
                                  proxy = get_proxy()
                                  if not proxy:
                                      time.sleep(1)
                                      continue
                                      
                                  print(f"[{run_id}] Internal Attempt {attempt}/10 | Testing Proxy: {proxy}", flush=True)
                                  send_live_log(run_id, f"🔍 تست سریع پراکسی {attempt}/10: {proxy}")
                                  
                                  # تست 4 ثانیه‌ای: آیا این پراکسی اصلاً روشن است؟
                                  try:
                                      test_r = requests.get("https://huggingface.co/", proxies={"http": f"socks5h://{proxy}", "https": f"socks5h://{proxy}"}, timeout=4)
                                      if test_r.status_code in [200, 401, 403, 404, 405]:
                                          print(f"[{run_id}] Proxy {proxy} is ALIVE! Spawning Gradio...", flush=True)
                                          send_live_log(run_id, f"✅ پراکسی روشن یافت شد. اتصال به سرور هوش مصنوعی...")
                                      else:
                                          continue
                                  except Exception:
                                      continue # پراکسی مُرده است، بدون معطلی برو بعدی
                                  
                                  # اگر پراکسی سالم بود، اسکریپت مدل را با آن اجرا می‌کنیم
                                  job_env = os.environ.copy()
                                  job_env["HTTP_PROXY"] = f"socks5h://{proxy}"
                                  job_env["HTTPS_PROXY"] = f"socks5h://{proxy}"
                                  job_env["ALL_PROXY"] = f"socks5h://{proxy}"
                                  
                                  for key, val in client_payload.items():
                                      if key != "data": 
                                          job_env[key.upper()] = str(val)
                                  
                                  payload_data = client_payload.get("data", {})
                                  if isinstance(payload_data, dict):
                                      for key, val in payload_data.items():
                                          if key == "image_urls": job_env["IMAGE_URLS"] = json.dumps(val)
                                          else: job_env[key.upper()] = str(val)
                                          
                                  process = subprocess.Popen(
                                      [sys.executable, script_file],
                                      env=job_env,
                                      stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT,
                                      text=True
                                  )
                                  
                                  def kill_proc(p):
                                      try: p.kill()
                                      except: pass
                                      
                                  # حداکثر 60 ثانیه فرصت رندر به مدل می‌دهیم
                                  timer = threading.Timer(60, kill_proc, [process])
                                  try:
                                      timer.start()
                                      for line in process.stdout:
                                          clean_line = line.strip()
                                          print(f"[{run_id}] {clean_line}", flush=True)
                                          send_live_log(run_id, f"[خروجی] {clean_line}")
                                      process.wait()
                                  finally:
                                      timer.cancel()
                                  
                                  if process.returncode == 0:
                                      success = True
                                      break
                                  else:
                                      print(f"[{run_id}] Proxy {proxy} failed at runtime or quota hit.", flush=True)
                                      send_live_log(run_id, f"⚠️ پراکسی روشن بود اما سهمیه نداشت. تعویض فوری در کسری از ثانیه...")

                              try: os.remove(script_file)
                              except: pass

                              if not success:
                                  print(f"[{run_id}] All 10 proxies failed. Retrying in queue...", flush=True)
                                  send_live_log(run_id, "❌ تمام ۱۰ پراکسی تست شده خراب بودند. بازگرداندن به صف برای تلاش مجدد سیستم...")
                                  try:
                                      requests.post(f"{SPACE_URL}/api/webhook/fail", json={"run_id": run_id, "error": "All 10 proxies failed.", "github_run_id": github_run_id}, timeout=15)
                                  except: pass
                                  
                  except Exception as e:
                      pass
                  time.sleep(2)

          threads = []
          # اجرای 20 کارگر موازی
          for idx in range(1, 21):
              t = threading.Thread(target=run_worker_thread, args=(idx,), daemon=True)
              t.start()
              threads.append(t)

          while time.time() - start_time < max_run_duration:
              time.sleep(10)

          print("All worker threads finished. Exiting.", flush=True)
          EOF
          python worker.py
