name: Persistent Worker

on:
  repository_dispatch:
    types: [start-worker]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Base Dependencies
        run: |
          pip install gradio_client requests[socks] pillow httpx[socks] pysocks socksio

      - name: Build VPN Gate Docker Image
        run: |
          mkdir -p vpn_docker
          cat << 'EOF' > vpn_docker/Dockerfile
          FROM alpine:latest
          RUN apk add --no-cache openvpn bash
          RUN apk add --no-cache microsocks --repository=http://dl-cdn.alpinelinux.org/alpine/edge/testing/
          COPY entrypoint.sh /entrypoint.sh
          RUN chmod +x /entrypoint.sh
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

          cat << 'EOF' > vpn_docker/entrypoint.sh
          #!/bin/bash
          echo -e "vpn\nvpn" > /pass.txt
          sed -i 's/^auth-user-pass.*/auth-user-pass \/pass.txt/' /vpn.ovpn
          
          # اجرای VPN
          openvpn --config /vpn.ovpn --connect-retry-max 1 --pull-filter ignore "ifconfig-ipv6" --pull-filter ignore "route-ipv6" --auth-retry nointeract &
          
          # اگر تونل (tun0) وصل شد، پراکسی را استارت بزن
          for i in {1..15}; do
            if ip link show tun0 > /dev/null 2>&1; then
              exec microsocks -p 1080
            fi
            sleep 1
          done
          
          echo "VPN failed to connect."
          exit 1
          EOF

          docker build -t vpngate-node vpn_docker/

      - name: Fetch VPN Gate & Start 40 TCP Nodes
        run: |
          echo "📥 Downloading VPN Gate database..."
          curl -s https://www.vpngate.net/api/iphone/ | grep -E "^[^#*]" > vpngate.csv
          
          sort -t, -k3 -nr vpngate.csv > sorted_vpn.csv
          
          i=1
          while IFS=, read -r HostName IP Score Ping Speed CountryLong CountryShort NumVpnSessions Uptime Users TotalTraffic LogType Operator Message OpenVPN_ConfigData_Base64; do
            if [ -n "$OpenVPN_ConfigData_Base64" ] && [ "$OpenVPN_ConfigData_Base64" != "\r" ]; then
              B64=$(echo "$OpenVPN_ConfigData_Base64" | tr -d '\r')
              echo "$B64" | base64 -d > "temp.ovpn" 2>/dev/null
              
              # فقط کانفیگ‌های TCP (ضد فایروال گیت‌هاب)
              if grep -iq "proto tcp" "temp.ovpn" && grep -qE "^remote .* (443|80|995|1194|5555) " "temp.ovpn"; then
                mv temp.ovpn "vpn_dir_$i.ovpn"
                PORT=$((4000 + i))
                docker run -d --name vpn$i --cap-add=NET_ADMIN --device=/dev/net/tun -v $(pwd)/vpn_dir_$i.ovpn:/vpn.ovpn -p $PORT:1080 vpngate-node > /dev/null 2>&1
                echo "✅ Started VPN Node $i on Port $PORT (TCP, $CountryLong)"
                i=$((i+1))
                if [ "$i" -gt 40 ]; then break; fi
              fi
            fi
          done < sorted_vpn.csv
          
          echo "⏳ Waiting 15 seconds for OpenVPN Handshakes..."
          sleep 15

      - name: Run Pre-Warmed Pool Worker
        env:
          SPACE_URL: ${{ github.event.client_payload.space_url }}
        run: |
          cat << 'EOF' > worker.py
          import os
          import sys
          import time
          import json
          import requests
          import subprocess
          import threading
          import concurrent.futures

          SPACE_URL = os.environ.get("SPACE_URL")
          if not SPACE_URL:
              sys.exit(1)

          github_run_id = os.environ.get("GITHUB_RUN_ID", "local-worker")
          start_time = time.time()
          max_run_duration = 5 * 60 * 60

          # استخر طلایی گره‌های تست شده و سالم
          GOLDEN_PORTS = []
          pool_lock = threading.Lock()

          def send_live_log(run_id, message):
              if not run_id: return
              try: requests.post(f"{SPACE_URL}/api/log/update", json={"run_id": str(run_id), "message": str(message)}, timeout=3)
              except: pass

          def test_port(port):
              """تست می‌کند آیا گره ژاپنی اینترنت دارد و سایت هاگینگ‌فیس را باز می‌کند یا نه"""
              proxy = f"127.0.0.1:{port}"
              try:
                  test_r = requests.get("https://huggingface.co/", proxies={"http": f"socks5h://{proxy}", "https": f"socks5h://{proxy}"}, timeout=8)
                  if test_r.status_code in [200, 401, 403, 404, 405]:
                      return port
              except:
                  pass
              return None

          print("🔍 [PHASE 1] Pre-warming: Testing all 40 VPN nodes simultaneously...", flush=True)
          # اجرای همزمان تست روی 40 پورت
          with concurrent.futures.ThreadPoolExecutor(max_workers=40) as executor:
              results = executor.map(test_port, range(4001, 4041))
              for port in results:
                  if port:
                      GOLDEN_PORTS.append(port)

          print(f"⭐ [PHASE 1 COMPLETE] Found {len(GOLDEN_PORTS)} healthy, ready-to-use VPN nodes: {GOLDEN_PORTS}", flush=True)

          def get_golden_port():
              with pool_lock:
                  if GOLDEN_PORTS:
                      # پورت را برمی‌دارد و به انتهای لیست می‌فرستد (چرخش عادلانه)
                      port = GOLDEN_PORTS.pop(0)
                      GOLDEN_PORTS.append(port)
                      return port
                  return None

          def remove_golden_port(port):
              with pool_lock:
                  if port in GOLDEN_PORTS:
                      GOLDEN_PORTS.remove(port)
                      print(f"🗑️ Port {port} removed from Golden Pool. Remaining: {len(GOLDEN_PORTS)}", flush=True)

          def run_worker_thread(worker_index):
              thread_worker_id = f"{github_run_id}_w{worker_index}"
              
              while time.time() - start_time < max_run_duration:
                  try:
                      try: requests.post(f"{SPACE_URL}/api/worker/heartbeat", json={"worker_id": thread_worker_id}, timeout=10)
                      except: pass

                      r = requests.post(f"{SPACE_URL}/api/worker/poll", json={"worker_id": thread_worker_id}, timeout=15)
                      if r.status_code == 200:
                          data = r.json()
                          if data.get("status") == "success":
                              run_id = data.get("run_id")
                              event_type = data.get("event_type")
                              client_payload = data.get("status") if 'client_payload' not in data else data.get("client_payload", {})
                              if not client_payload or client_payload == "success": client_payload = data.get("client_payload", {})

                              send_live_log(run_id, f"📥 تسک به کارگر گیت‌هاب واگذار شد.")
                              
                              script_content = client_payload.get("data", {}).get("script") or client_payload.get("script")
                              if not script_content: continue
                                  
                              script_file = f"run_job_{run_id}_w{worker_index}.py"
                              with open(script_file, "w", encoding="utf-8") as f:
                                  f.write(script_content)

                              success = False
                              
                              # تلاش از داخل استخر طلایی بدون معطلی
                              for attempt in range(1, 11):
                                  port = get_golden_port()
                                  if not port:
                                      send_live_log(run_id, "⚠️ استخر آی‌پی‌های طلایی خالی شده است! در انتظار آزاد شدن گره...")
                                      time.sleep(5)
                                      continue
                                      
                                  proxy = f"127.0.0.1:{port}"
                                  print(f"[{run_id}] Executing on Golden Port {port}...", flush=True)
                                  send_live_log(run_id, f"🚀 اتصال فوری به گره پیش‌تست‌شده (پورت {port}). شروع رندر...")
                                  
                                  job_env = os.environ.copy()
                                  job_env["HTTP_PROXY"] = f"socks5h://{proxy}"
                                  job_env["HTTPS_PROXY"] = f"socks5h://{proxy}"
                                  job_env["ALL_PROXY"] = f"socks5h://{proxy}"
                                  
                                  for key, val in client_payload.items():
                                      if key != "data": job_env[key.upper()] = str(val)
                                  
                                  payload_data = client_payload.get("data", {})
                                  if isinstance(payload_data, dict):
                                      for key, val in payload_data.items():
                                          if key == "image_urls": job_env["IMAGE_URLS"] = json.dumps(val)
                                          else: job_env[key.upper()] = str(val)
                                          
                                  process = subprocess.Popen(
                                      [sys.executable, "-u", script_file],
                                      env=job_env,
                                      stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT,
                                      text=True
                                  )
                                  
                                  def kill_proc(p):
                                      try: p.kill()
                                      except: pass
                                      
                                  # حداکثر 90 ثانیه فرصت رندر
                                  timer = threading.Timer(90, kill_proc, [process])
                                  try:
                                      timer.start()
                                      for line in process.stdout:
                                          clean_line = line.strip()
                                          print(f"[{run_id}] {clean_line}", flush=True)
                                          send_live_log(run_id, f"[خروجی] {clean_line}")
                                      process.wait()
                                  finally:
                                      timer.cancel()
                                  
                                  if process.returncode == 0:
                                      success = True
                                      break
                                  else:
                                      # اگر گره طلایی سهمیه‌اش پر شده بود، آن را از استخر طلایی خط می‌زنیم تا دیگر کارگرها از آن استفاده نکنند
                                      remove_golden_port(port)
                                      send_live_log(run_id, f"⚠️ سهمیه این گره پُر شد! گره از استخر حذف شد. پرش فوری به گره آماده بعدی...")

                              try: os.remove(script_file)
                              except: pass

                              if not success:
                                  send_live_log(run_id, "❌ تمام گره‌های استخر طلایی مسدود شدند! بازگرداندن به صف...")
                                  try: requests.post(f"{SPACE_URL}/api/webhook/fail", json={"run_id": run_id, "error": "Pool depleted.", "github_run_id": github_run_id}, timeout=15)
                                  except: pass
                                  
                  except Exception as e:
                      pass
                  time.sleep(2)

          threads = []
          # اجرای 40 کارگر موازی
          for idx in range(1, 41):
              t = threading.Thread(target=run_worker_thread, args=(idx,), daemon=True)
              t.start()
              threads.append(t)

          while time.time() - start_time < max_run_duration:
              time.sleep(10)

          print("All worker threads finished. Exiting.", flush=True)
          EOF
          python worker.py
