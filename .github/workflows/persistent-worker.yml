name: Persistent Worker

on:
  repository_dispatch:
    types: [start-worker]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Base Dependencies
        run: |
          pip install "gradio_client" "requests[socks]" "pillow" "httpx[socks]" pysocks socksio

      - name: Install and Start Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          
          # فیلتر کردن شدید کشورهای پرمصرف جهت هدایت تور به سمت کشورهای خلوت با سهمیه بکر
          echo "ControlPort 9051" | sudo tee -a /etc/tor/torrc
          echo "CookieAuthentication 0" | sudo tee -a /etc/tor/torrc
          echo "ExcludeExitNodes {us},{de},{gb},{fr},{nl},{ru},{cn},{ca},{sg},{ua}" | sudo tee -a /etc/tor/torrc
          echo "StrictNodes 1" | sudo tee -a /etc/tor/torrc
          echo "MaxCircuitDirtiness 10" | sudo tee -a /etc/tor/torrc
          echo "NewCircuitPeriod 10" | sudo tee -a /etc/tor/torrc
          
          sudo service tor restart
          sleep 10
          curl --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip || true

      - name: Run Persistent Worker
        env:
          SPACE_URL: ${{ github.event.client_payload.space_url }}
        run: |
          cat << 'EOF' > worker.py
          import os
          import sys
          import time
          import json
          import socket
          import requests
          import subprocess
          from datetime import datetime

          SPACE_URL = os.environ.get("SPACE_URL")
          if not SPACE_URL:
              print("Error: SPACE_URL env var is not set.", flush=True)
              sys.exit(1)

          print(f"Starting long-running worker for Space: {SPACE_URL}", flush=True)

          start_time = time.time()
          max_run_duration = 5 * 60 * 60  # 5 hours

          def renew_tor_ip():
              """ارسال سیگنال به پورت کنترلی تور جهت تغییر هویت"""
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.settimeout(5)
                  s.connect(('127.0.0.1', 9051))
                  s.send(b'AUTHENTICATE ""\r\n')
                  res = s.recv(1024)
                  if b'250' in res:
                      s.send(b'SIGNAL NEWNYM\r\n')
                      res2 = s.recv(1024)
                      if b'250' in res2:
                          print("🔄 Tor IP successfully rotated/renewed.", flush=True)
                          s.close()
                          return True
                  s.close()
                  print(f"⚠️ Tor renewal failed. Auth response: {res}", flush=True)
              except Exception as e:
                  print(f"⚠️ Error renewing Tor IP: {e}", flush=True)
              return False

          def get_current_ip():
              """دریافت آی‌پی عمومی فعلی پروکسی تور"""
              try:
                  proxies = {
                      'http': 'socks5h://127.0.0.1:9050',
                      'https': 'socks5h://127.0.0.1:9050'
                  }
                  r = requests.get("https://api.ipify.org", proxies=proxies, timeout=12)
                  return r.text.strip()
              except Exception as e:
                  return f"Unknown ({e})"

          while time.time() - start_time < max_run_duration:
              try:
                  # Send heartbeat to Space
                  try:
                      requests.post(f"{SPACE_URL}/api/worker/heartbeat", json={}, timeout=10)
                  except Exception as e:
                      print(f"Heartbeat failed: {e}", flush=True)

                  # Poll for new jobs
                  r = requests.post(f"{SPACE_URL}/api/worker/poll", json={}, timeout=15)
                  if r.status_code == 200:
                      data = r.json()
                      if data.get("status") == "success":
                          run_id = data.get("run_id")
                          event_type = data.get("event_type")
                          client_payload = data.get("client_payload", {})
                          
                          print(f"[{datetime.now()}] Processing job {run_id} ({event_type})...", flush=True)
                          
                          # Prepare environment variables for the job script
                          job_env = os.environ.copy()
                          
                          # Inject Tor proxy to bypass rate limits
                          job_env["HTTP_PROXY"] = "socks5h://127.0.0.1:9050"
                          job_env["HTTPS_PROXY"] = "socks5h://127.0.0.1:9050"
                          
                          # Map client_payload to environment variables
                          for key, val in client_payload.items():
                              if key != "data":
                                  job_env[key.upper()] = str(val)
                          
                          payload_data = client_payload.get("data", {})
                          if isinstance(payload_data, dict):
                              for key, val in payload_data.items():
                                  if key == "image_urls":
                                      job_env["IMAGE_URLS"] = json.dumps(val)
                                  else:
                                      job_env[key.upper()] = str(val)
                          
                          # Extract the script
                          script_content = payload_data.get("script") or client_payload.get("script")
                          if not script_content:
                              print(f"Error: No script found in payload for job {run_id}", flush=True)
                              continue
                              
                          # Write script to temporary file
                          script_file = "run_job.py"
                          with open(script_file, "w", encoding="utf-8") as f:
                              f.write(script_content)
                              
                          max_ip_attempts = 15
                          ip_attempt = 0
                          job_success = False
                          last_ip = None

                          while ip_attempt < max_ip_attempts:
                              ip_attempt += 1
                              current_ip = get_current_ip()
                              
                              # تأیید فیزیکی تغییر آی‌پی و جلوگیری از هدر رفتن تلاش روی آی‌پی تکراری
                              if last_ip and current_ip == last_ip and ip_attempt > 1:
                                  print(f"[{run_id}] IP did not change ({current_ip}). Re-requesting Tor circuit...", flush=True)
                                  renew_tor_ip()
                                  time.sleep(12)
                                  current_ip = get_current_ip()
                                  
                              last_ip = current_ip
                              print(f"[{run_id}] Current Tor IP: {current_ip}", flush=True)
                              print(f"Executing script for job {run_id} (IP Attempt {ip_attempt}/{max_ip_attempts})...", flush=True)
                              
                              process = subprocess.Popen(
                                  [sys.executable, script_file],
                                  env=job_env,
                                  stdout=subprocess.PIPE,
                                  stderr=subprocess.STDOUT,
                                  text=True
                              )
                              
                              output_lines = []
                              for line in process.stdout:
                                  print(f"[{run_id}] {line.strip()}", flush=True)
                                  output_lines.append(line)
                                  
                              process.wait()
                              
                              if process.returncode == 0:
                                  print(f"Job {run_id} finished successfully.", flush=True)
                                  job_success = True
                                  break
                              
                              # هرگونه شکست در اجرای اسکریپت (کد خروجی غیر از صفر) به عنوان مشکل شبکه یا لیمیت آی‌پی تلقی می‌شود
                              print(f"[{run_id}] ⚠️ Job failed (Exit Code {process.returncode}). Assuming IP rate-limit/quota issue.", flush=True)
                              if ip_attempt < max_ip_attempts:
                                  print(f"[{run_id}] Rotating Tor circuit and sleeping 12s before retrying...", flush=True)
                                  renew_tor_ip()
                                  time.sleep(12)
                                  continue
                              else:
                                  print(f"[{run_id}] Max IP rotation attempts reached for this job.", flush=True)
                                  break
                                  
                          if not job_success:
                              sys.exit(1)
                              
                          continue
                          
              except Exception as e:
                  print(f"Error in worker loop: {e}", flush=True)
                  
              time.sleep(5)

          print("Worker reached maximum run duration. Exiting.", flush=True)
          EOF
          python worker.py
