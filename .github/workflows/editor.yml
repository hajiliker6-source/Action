name: Editor Image Generator

on:
  repository_dispatch:
    types: [generate-editor]

jobs:
  build_editor:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install gradio_client requests httpx

      - name: Generate and Send Edited Image
        env:
          PROMPT: ${{ github.event.client_payload.prompt }}
          IMAGE_URL: ${{ github.event.client_payload.image_url }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          SPACE_URL: ${{ github.event.client_payload.space_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python -c "
          import os, sys, requests, random, time
          import httpx
          
          # =========================================================
          # رفع قطعی مشکل Time Out
          original_client_init = httpx.Client.__init__
          def patched_client_init(self, *args, **kwargs):
              kwargs['timeout'] = httpx.Timeout(300.0)
              original_client_init(self, *args, **kwargs)
          httpx.Client.__init__ = patched_client_init
          
          original_async_init = httpx.AsyncClient.__init__
          def patched_async_init(self, *args, **kwargs):
              kwargs['timeout'] = httpx.Timeout(300.0)
              original_async_init(self, *args, **kwargs)
          httpx.AsyncClient.__init__ = patched_async_init
          # =========================================================

          from gradio_client import Client, handle_file

          prompt = os.environ.get('PROMPT', '')
          image_url = os.environ.get('IMAGE_URL', '')
          run_id = os.environ.get('RUN_ID')
          space_url = os.environ.get('SPACE_URL')
          github_run_id = os.environ.get('GITHUB_RUN_ID')

          print('1. Downloading input image for Flux.2 Editing...')
          try:
              req = requests.get(image_url, timeout=30)
              with open('input_to_edit.png', 'wb') as f:
                  f.write(req.content)
              print('   -> Input image ready.')
          except Exception as e:
              print(f'Download failed: {e}')
              sys.exit(1)

          print('2. Connecting to FLUX.2-dev and Processing...')
          success = False
          result_path = None
          
          for attempt in range(3):
              try:
                  print(f'   -> Attempt {attempt + 1} of 3...')
                  # اتصال به فضای Flux.2
                  client = Client('black-forest-labs/FLUX.2-dev')
                  
                  seed = random.randint(1, 2147483647)
                  
                  # آماده‌سازی تصویر ورودی طبق ساختار Flux.2-dev
                  files_to_send = [{'image': handle_file('input_to_edit.png'), 'caption': None}]
                  
                  # اجرای پیش‌بینی (Image-to-Image / Edit)
                  result = client.predict(
                      prompt,           # دستور ویرایش
                      files_to_send,    # تصویر ورودی
                      seed,             # سید
                      True,             # Randomize Seed
                      1024,             # Width
                      1024,             # Height
                      30,               # Steps
                      4.0,              # Guidance
                      True,             # Prompt Upsampling
                      api_name='/infer'
                  )
                  
                  if result:
                      result_path = result[0] if isinstance(result, (tuple, list)) else result
                      if result_path and os.path.exists(str(result_path)):
                          success = True
                          break
              except Exception as client_err:
                  print(f'   -> Attempt {attempt + 1} failed: {client_err}')
                  time.sleep(5)

          if not success:
              print(f'CRITICAL ERROR: Flux.2 failed to generate result.')
              sys.exit(1)

          print('3. Preparing generated image...')
          # تشخیص پسوند فایل خروجی
          ext = 'png'
          if str(result_path).endswith('.webp'): ext = 'webp'
          elif str(result_path).endswith('.jpg') or str(result_path).endswith('.jpeg'): ext = 'jpg'
          
          filename = f'output.{ext}'
          
          print(f'4. Uploading back to Docker Space: {space_url}')
          try:
              with open(result_path, 'rb') as f:
                  res = requests.post(
                      f'{space_url}/api/webhook/upload', 
                      data={'run_id': run_id, 'github_run_id': github_run_id, 'ext': ext}, 
                      files={'file': f},
                      timeout=60
                  )
              
              if res.status_code == 200:
                  print('5. SUCCESS! Process finished successfully.')
              else:
                  print(f'Upload to Docker failed: {res.status_code} - {res.text}')
                  sys.exit(1)
          except Exception as up_err:
              print(f'Failed to upload to webhook: {up_err}')
              sys.exit(1)
          "
